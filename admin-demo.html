<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>AKV Admin — Demo</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  A pitch demo of the admin panel the studio would get. It runs on the
  site's real couples and photographs (js/albums.js, js/data.js) but
  saves nothing: every change lives in this tab until it is reloaded.
  Not linked from the site; safe to delete.
-->
<style>
:root{
  --paper:#FBF9F5; --paper-2:#F3EFE7; --paper-3:#E9E3D8; --card:#FFFFFF;
  --ink:#171412; --text:#45403A; --muted:#6E665A;
  --brass:#8A6C25; --brass-lg:#A8862F; --brass-dim:rgba(168,134,47,.12);
  --line:rgba(23,20,18,.15); --line-soft:rgba(23,20,18,.08);
  --ok:#2F6B45;
  --font-d:"Cormorant Garamond", Georgia, serif;
  --font-b:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:10px;
}
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:var(--font-b); font-size:14px; color:var(--text); background:var(--paper-2); -webkit-font-smoothing:antialiased; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
img{ display:block; max-width:100%; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--brass); outline-offset:2px; }

.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:38px; padding:0 16px;
  border-radius:999px; border:1px solid var(--ink); background:var(--ink); color:var(--paper);
  font-size:12px; font-weight:500; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
.btn:hover{ background:#2E2822; }
.btn--ghost{ background:transparent; color:var(--ink); border-color:var(--line); }
.btn--ghost:hover{ background:var(--paper-2); border-color:var(--ink); }
.btn--sm{ height:32px; padding:0 12px; font-size:11px; }
.eyebrow{ font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--brass); margin:0 0 6px; }
.h{ font-family:var(--font-d); font-weight:400; color:var(--ink); margin:0; }

/* --- sign in ------------------------------------------------ */
.login{ min-height:100%; display:grid; place-items:center; padding:24px; background:var(--paper); }
.login__card{ width:min(100%, 380px); text-align:center; }
.login__card img{ height:150px; margin:0 auto 26px; }
.login__card form{ display:grid; gap:12px; text-align:left; background:var(--card); padding:24px;
  border:1px solid var(--line-soft); border-radius:16px; box-shadow:0 10px 30px -18px rgba(23,20,18,.3); }
.login__card .note{ font-size:12px; color:var(--muted); margin:14px 0 0; }

.field{ display:grid; gap:6px; }
.field label{ font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.field input,.field select,.field textarea{ width:100%; padding:10px 12px; background:var(--card);
  border:1px solid var(--line); border-radius:8px; }
.field textarea{ min-height:120px; resize:vertical; line-height:1.55; }
.field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--brass); box-shadow:0 0 0 3px var(--brass-dim); }
.row{ display:grid; gap:14px; }
@media (min-width:720px){ .row--2{ grid-template-columns:1fr 1fr; } .row--3{ grid-template-columns:1fr 1fr 1fr; } }

/* --- the panel ---------------------------------------------- */
.app{ height:100%; display:grid; grid-template-rows:auto 1fr; }
.top{ display:flex; align-items:center; gap:14px; padding:10px 18px; background:var(--card); border-bottom:1px solid var(--line-soft); }
.top__logo{ height:30px; width:auto; }
.top__tag{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding-left:14px; border-left:1px solid var(--line); }
.top__demo{ font-size:11px; color:var(--brass); background:var(--brass-dim); padding:4px 10px; border-radius:999px; }
.top__sp{ flex:1; }
.top__user{ width:34px; height:34px; border-radius:50%; background:var(--paper-3); display:grid; place-content:center;
  font-family:var(--font-d); font-size:16px; color:var(--ink); }
.only-narrow{ display:none; }

.body{ display:grid; grid-template-columns:200px minmax(0,1fr) minmax(0,440px); min-height:0; }
.side{ background:var(--card); border-right:1px solid var(--line-soft); padding:16px 10px; display:flex; flex-direction:column; gap:2px; }
.side button{ text-align:left; padding:10px 12px; border:0; background:none; border-radius:8px; color:var(--text); }
.side button:hover{ background:var(--paper-2); }
.side button[aria-current="true"]{ background:var(--paper-2); color:var(--ink); font-weight:500; }
.side small{ display:block; font-size:11px; color:var(--muted); }
.main{ overflow:auto; padding:26px clamp(16px,3vw,34px) 60px; }
.view__head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
.view__head .h{ font-size:34px; line-height:1.05; }
.hint{ font-size:12.5px; color:var(--muted); margin:6px 0 0; }
.panel{ background:var(--card); border:1px solid var(--line-soft); border-radius:14px; padding:20px; margin-bottom:16px; }
.panel__title{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 14px; }
.panel__title .h{ font-size:22px; }

/* couples list */
.list{ display:grid; gap:8px; }
.item{ display:grid; grid-template-columns:auto 72px 1fr auto; align-items:center; gap:14px; padding:10px 12px;
  background:var(--card); border:1px solid var(--line-soft); border-radius:12px; }
.item.is-hidden{ opacity:.5; }
.drag{ width:26px; height:34px; border:0; background:none; color:var(--muted); cursor:grab; display:grid; place-content:center; touch-action:none; }
.drag svg{ width:14px; height:18px; }
.item__img{ width:72px; aspect-ratio:3/2; border-radius:6px; background:var(--paper-3); object-fit:cover; }
.item__name{ font-family:var(--font-d); font-size:21px; color:var(--ink); line-height:1.1; }
.item__meta{ font-size:12px; color:var(--muted); margin-top:3px; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
.chip{ font-size:10.5px; letter-spacing:.06em; padding:3px 8px; border-radius:999px; background:var(--paper-2); color:var(--muted); }
.item__act{ display:flex; gap:6px; align-items:center; }
.sortable-ghost{ opacity:.35; }
.sortable-chosen{ box-shadow:0 14px 30px -16px rgba(23,20,18,.45); }

.toggle{ position:relative; width:38px; height:22px; border-radius:999px; border:0; background:var(--paper-3); flex:none; }
.toggle::after{ content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transition:transform .2s; }
.toggle[aria-pressed="true"]{ background:var(--ok); }
.toggle[aria-pressed="true"]::after{ transform:translateX(16px); }

.checks{ display:flex; gap:16px; flex-wrap:wrap; }
.checks label{ display:flex; align-items:center; gap:8px; font-size:13.5px; text-transform:none; letter-spacing:0; color:var(--text); white-space:nowrap; }
.checks input{ accent-color:var(--ink); width:16px; height:16px; }
.back{ border:0; background:none; color:var(--brass); padding:0; margin-bottom:10px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; }

/* photo grid */
.drop{ display:grid; place-items:center; gap:6px; padding:22px; border:1.5px dashed var(--line); border-radius:12px;
  background:var(--paper); text-align:center; color:var(--muted); cursor:pointer; margin-bottom:14px; }
.drop.is-over{ border-color:var(--brass); background:var(--brass-dim); }
.drop b{ color:var(--ink); font-weight:500; }
.photos{ display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:8px; }
.ph{ position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--paper-3); cursor:grab; touch-action:none; }
.ph img{ width:100%; height:100%; object-fit:cover; pointer-events:none; }
.ph__n{ position:absolute; left:5px; top:5px; font-size:10px; background:rgba(23,20,18,.6); color:#fff; padding:1px 6px; border-radius:999px; }
.ph__btn{ position:absolute; width:26px; height:26px; border-radius:50%; border:0; display:grid; place-content:center;
  background:rgba(251,249,245,.92); color:var(--ink); font-size:14px; line-height:1; opacity:0; transition:opacity .2s; }
.ph:hover .ph__btn,.ph:focus-within .ph__btn,.ph__btn.is-on{ opacity:1; }
.ph__star{ right:5px; top:5px; }
.ph__star.is-on{ background:var(--brass-lg); color:#fff; }
.ph__del{ right:5px; bottom:5px; }
.ph.is-new::after{ content:"New"; position:absolute; left:5px; bottom:5px; font-size:10px; background:var(--ok); color:#fff; padding:1px 6px; border-radius:999px; }
@media (hover:none){ .ph__btn{ opacity:1; } }

/* home layout */
.sec{ display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:12px; padding:12px; border:1px solid var(--line-soft); border-radius:10px; background:var(--card); }
.sec.is-hidden .sec__name{ opacity:.45; text-decoration:line-through; }
.sec__name{ font-size:14px; color:var(--ink); }
.sec__name small{ display:block; font-size:12px; color:var(--muted); }
.slides{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.slide{ position:relative; aspect-ratio:4/5; border-radius:8px; overflow:hidden; background:var(--paper-3); cursor:grab; touch-action:none; }
.slide img{ width:100%; height:100%; object-fit:cover; pointer-events:none; }
.slide button{ position:absolute; left:50%; bottom:6px; transform:translateX(-50%); }

/* --- live preview ------------------------------------------- */
.preview{ border-left:1px solid var(--line-soft); background:var(--paper-3); display:flex; flex-direction:column; min-height:0; }
.preview__bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; }
.preview__bar span{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
.preview__dot{ display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--ok); margin-right:6px; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; }
.seg button{ border:0; background:none; padding:5px 12px; font-size:11.5px; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--paper); }
.preview__stage{ flex:1; overflow:auto; display:flex; justify-content:center; padding:0 16px 20px; }
.screen{ width:100%; background:var(--paper); border-radius:12px; overflow:hidden; box-shadow:0 18px 40px -22px rgba(23,20,18,.45); align-self:flex-start; }
.screen.is-phone{ width:300px; border-radius:26px; border:8px solid var(--ink); }
.sc__nav{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--line-soft); }
.sc__nav img{ height:18px; }
.sc__nav i{ font-style:normal; font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
.sc__body{ padding:18px 14px 26px; }
.sc__title{ font-family:var(--font-d); font-size:24px; color:var(--ink); text-align:center; margin:0 0 14px; font-weight:300; }
.sc__thumbs{ display:grid; grid-template-columns:1fr 1fr; gap:14px 10px; }
.is-phone .sc__thumbs{ grid-template-columns:1fr; }
.sc__thumb span{ display:block; aspect-ratio:3/2; background:var(--paper-3); overflow:hidden; }
.sc__thumb img{ width:100%; height:100%; object-fit:cover; }
.sc__thumb p{ font-family:var(--font-d); font-size:15px; color:var(--ink); text-align:center; margin:6px 0 0; line-height:1.2; }
.sc__intro{ text-align:center; margin-bottom:14px; }
.sc__intro .eyebrow{ font-size:8.5px; }
.sc__intro h3{ font-family:var(--font-d); font-weight:300; font-size:26px; color:var(--ink); margin:0 0 8px; line-height:1.05; }
.sc__intro p{ font-family:var(--font-d); font-style:italic; font-size:13px; line-height:1.5; margin:0; }
.sc__reel{ display:grid; gap:8px; justify-items:center; }
.sc__reel img{ width:auto; max-width:100%; max-height:300px; }
.sc__more{ font-size:11px; color:var(--muted); text-align:center; margin-top:10px; }
.sc__block{ border:1px dashed var(--line); border-radius:8px; padding:12px; margin-bottom:8px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; }
.sc__hero{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:center; margin-bottom:8px; }
.is-phone .sc__hero{ grid-template-columns:1fr; }
.sc__hero h3{ font-family:var(--font-d); font-weight:300; font-size:22px; line-height:1.1; color:var(--ink); margin:0 0 6px; }
.sc__hero p{ font-size:10.5px; margin:0; }
.sc__hero img{ aspect-ratio:4/5; object-fit:cover; width:100%; }
.sc__foot{ background:var(--ink); color:rgba(251,249,245,.75); padding:18px 14px; font-size:11.5px; line-height:1.6; }
.sc__foot img{ height:60px; margin-bottom:12px; }
.sc__foot b{ color:var(--paper); font-weight:500; }

.toast{ position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; pointer-events:none;
  background:var(--ink); color:var(--paper); padding:14px 20px; border-radius:12px; font-size:13.5px;
  box-shadow:0 18px 40px -16px rgba(0,0,0,.5); transition:opacity .3s, transform .3s; z-index:50; max-width:calc(100% - 32px); }
.toast.is-on{ opacity:1; transform:translate(-50%,0); }
.toast small{ display:block; color:rgba(251,249,245,.6); font-size:11.5px; margin-top:3px; }

/* photo picker */
.picker{ position:fixed; inset:0; z-index:40; background:rgba(23,20,18,.55); display:grid; place-items:center; padding:16px; }
.picker__card{ width:min(100%,860px); max-height:86vh; overflow:auto; background:var(--card); border-radius:16px; padding:20px; }
.picker .photos{ grid-template-columns:repeat(auto-fill, minmax(88px,1fr)); }
.picker .ph{ cursor:pointer; }

/* --- narrow screens: tabs on top, preview on a button -------- */
@media (max-width:1100px){
  .body{ grid-template-columns:180px minmax(0,1fr); }
  .preview{ position:fixed; inset:0; z-index:30; border:0; }
  .preview:not(.is-open){ display:none; }
  .only-narrow{ display:inline-flex; }
}
@media (max-width:700px){
  .top{ flex-wrap:wrap; padding:10px 12px; }
  .top__tag,.top__user{ display:none; }
  .body{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
  .side{ flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line-soft); padding:8px; }
  .side button{ white-space:nowrap; }
  .side small{ display:none; }
  .item{ grid-template-columns:auto 56px 1fr; }
  .item__img{ width:56px; }
  .item__act{ grid-column:2 / -1; }
  .main{ padding:18px 14px 80px; }
}
</style>
</head>
<body>

<!-- ============================ SIGN IN ============================ -->
<section class="login" id="login">
  <div class="login__card">
    <img src="assets/brand/logo-light.svg" alt="AKV Photography" style="filter:invert(1)">
    <form id="login-form">
      <p class="eyebrow" style="margin:0">Studio admin</p>
      <div class="field"><label for="u">Email</label><input id="u" type="email" value="anil@akvphotography.in" autocomplete="off"></div>
      <div class="field"><label for="p">Password</label><input id="p" type="password" value="demo-password" autocomplete="off"></div>
      <button class="btn" type="submit" style="margin-top:6px">Sign in</button>
    </form>
    <p class="note">Demo: any details will do. Nothing you change here touches the live website.</p>
  </div>
</section>

<!-- ============================ THE PANEL ============================ -->
<div class="app" id="app" hidden>
  <header class="top">
    <img class="top__logo" src="assets/brand/logo-row.svg" alt="AKV Photography">
    <span class="top__tag">Admin</span>
    <span class="top__demo">Demo mode</span>
    <span class="top__sp"></span>
    <button class="btn btn--ghost btn--sm only-narrow" id="open-preview" type="button">Preview</button>
    <button class="btn btn--sm" id="publish" type="button">Publish changes</button>
    <span class="top__user" title="Anil Kumar Venkatesh">A</span>
  </header>

  <div class="body">
    <nav class="side" aria-label="Sections">
      <button type="button" data-view="couples" aria-current="true">Couples<small>Stories, photos, order</small></button>
      <button type="button" data-view="home">Home page<small>Sections, hero photos</small></button>
      <button type="button" data-view="details">Studio details<small>Phone, address, hours</small></button>
    </nav>

    <main class="main" id="main"></main>

    <aside class="preview" id="preview" aria-label="Live preview">
      <div class="preview__bar">
        <span><i class="preview__dot"></i>Live preview</span>
        <div style="display:flex;gap:8px;align-items:center">
          <div class="seg" role="group" aria-label="Device">
            <button type="button" data-dev="desk" aria-pressed="true">Desktop</button>
            <button type="button" data-dev="phone" aria-pressed="false">Phone</button>
          </div>
          <button class="btn btn--ghost btn--sm only-narrow" id="close-preview" type="button">Close</button>
        </div>
      </div>
      <div class="preview__stage"><div class="screen" id="screen"></div></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script src="js/albums.js"></script>
<script src="js/data.js"></script>
<script>
(function () {
  'use strict';
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const unent = (s) => String(s).replace(/&amp;/g, '&').replace(/&middot;/g, '·').replace(/&rsquo;/g, '’');
  const GRIP = '<svg viewBox="0 0 10 16" fill="currentColor"><circle cx="2" cy="2" r="1.5"/><circle cx="8" cy="2" r="1.5"/><circle cx="2" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="2" cy="14" r="1.5"/><circle cx="8" cy="14" r="1.5"/></svg>';

  /* ---------- the studio's real content, copied into this tab ---------- */
  let uid = 0;
  const frameOf = (album, f) => ({ id: 'p' + (uid++), thumb: ALBUM_SRC(album, f, 640), big: ALBUM_SRC(album, f, 1080), stem: f[0] });
  const state = {
    couples: AKV.couples.map((c) => ({
      id: c.slug,
      name: unent(c.couple),
      kind: c.kind,
      place: c.place,
      date: c.date || '',
      story: unent(c.story),
      show: { stories: true, prewedding: c.page === 'films', home: true },
      visible: true,
      photos: c.album ? c.photos.map((f) => frameOf(c.album, f)) : [],
      cover: null
    })),
    home: {
      title: 'The tiny details hold the best memories.',
      lede: unent(AKV.hero.body),
      slides: AKV.hero.slides.map((s) => ({ id: 'p' + (uid++), thumb: s.src, big: s.src })),
      sections: [
        ['Hero', 'Headline and sliding photographs'], ['Film strip', 'A moving row of photographs'],
        ['The studio', 'Anil and the studio story'], ['Numbers', '600+ weddings, 14 years'],
        ['How a shoot runs', 'The three steps'], ['Real weddings', 'Couple cards'],
        ['Occasions we cover', 'The list of functions'], ['What we shoot', 'Nine services'],
        ['Reviews', 'What the couples said'], ['Enquiry form', 'Check your date']
      ].map(([name, note], i) => ({ id: 's' + i, name: name, note: note, on: true }))
    },
    details: {
      phone: AKV.contact.phone, phone2: AKV.contact.phone2, whatsapp: '+91 98030 60906',
      address: unent(AKV.contact.addressLine1 + ', ' + AKV.contact.addressLine2 + ', ' + AKV.contact.addressLine3),
      hours: AKV.contact.hours, instagram: '@a.k.vphotography'
    }
  };
  state.couples.forEach((c) => {
    const src = AKV.couples.find((x) => x.slug === c.id);
    const hit = src.cover && c.photos.find((p) => p.stem === src.cover);
    c.cover = hit ? hit.id : (c.photos[0] ? c.photos[0].id : null);
  });
  const allPhotos = () => state.couples.flatMap((c) => c.photos);

  let view = 'couples';
  let editing = null;
  let device = 'desk';
  const sortables = [];
  const main = $('#main');
  const screen = $('#screen');

  /* ---------- small helpers ---------- */
  const toast = (msg, sub) => {
    const t = $('#toast');
    t.innerHTML = esc(msg) + (sub ? '<small>' + esc(sub) + '</small>' : '');
    t.classList.add('is-on');
    clearTimeout(toast.t);
    toast.t = setTimeout(() => t.classList.remove('is-on'), 3600);
  };
  const sortable = (el, list, opts) => {
    sortables.push(Sortable.create(el, Object.assign({
      animation: 160,
      onEnd: (e) => {
        if (e.oldIndex === e.newIndex) return;
        const [moved] = list.splice(e.oldIndex, 1);
        list.splice(e.newIndex, 0, moved);
        render();
      }
    }, opts || {})));
  };
  const coverOf = (c) => c.photos.find((p) => p.id === c.cover);
  const kinds = ['Wedding', 'Engagement', 'Pre-wedding', 'Reception', 'Maternity'];

  /* ---------- the views ---------- */
  const renderCouples = () => {
    if (editing) return renderCouple(state.couples.find((c) => c.id === editing));
    main.innerHTML =
      '<div class="view__head"><div><p class="eyebrow">Stories page</p><h1 class="h">Couples</h1>' +
        '<p class="hint">Drag the handle to change the order couples appear on the website. Switch one off to hide it.</p></div>' +
        '<button class="btn" type="button" id="add-couple">+ Add a couple</button></div>' +
      '<div class="list" id="clist">' + state.couples.map((c) => {
        const cov = coverOf(c);
        const where = [c.show.stories && 'Stories', c.show.prewedding && 'Pre-Wedding', c.show.home && 'Home'].filter(Boolean);
        return '<div class="item' + (c.visible ? '' : ' is-hidden') + '" data-id="' + c.id + '">' +
          '<button class="drag" type="button" aria-label="Drag to reorder">' + GRIP + '</button>' +
          (cov ? '<img class="item__img" src="' + cov.thumb + '" alt="">' : '<span class="item__img"></span>') +
          '<div><div class="item__name">' + esc(c.name) + '</div>' +
            '<div class="item__meta">' + esc(c.kind) + ' · ' + (c.photos.length ? c.photos.length + ' photos' : 'No photos yet') + '</div>' +
            '<div class="chips">' + where.map((w) => '<span class="chip">' + w + '</span>').join('') + '</div></div>' +
          '<div class="item__act">' +
            '<button class="toggle" type="button" data-vis="' + c.id + '" aria-pressed="' + c.visible + '" aria-label="Show on the website"></button>' +
            '<button class="btn btn--ghost btn--sm" type="button" data-edit="' + c.id + '">Edit</button></div>' +
        '</div>';
      }).join('') + '</div>';
    sortable($('#clist'), state.couples, { handle: '.drag' });
  };

  const renderCouple = (c) => {
    main.innerHTML =
      '<button class="back" type="button" id="back">&larr; All couples</button>' +
      '<div class="view__head"><div><p class="eyebrow">Editing</p><h1 class="h">' + esc(c.name || 'New couple') + '</h1></div>' +
        '<button class="btn" type="button" id="done">Done</button></div>' +
      '<section class="panel"><div class="panel__title"><h2 class="h">Their story</h2></div>' +
        '<div class="row" style="gap:14px">' +
          '<div class="row row--2">' +
            '<div class="field"><label for="f-name">Names</label><input id="f-name" data-k="name" value="' + esc(c.name) + '" placeholder="Bride & Groom"></div>' +
            '<div class="field"><label for="f-kind">Occasion</label><select id="f-kind" data-k="kind">' +
              kinds.map((k) => '<option' + (k === c.kind ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>' +
          '</div>' +
          '<div class="row row--2">' +
            '<div class="field"><label for="f-place">Place</label><input id="f-place" data-k="place" value="' + esc(c.place) + '"></div>' +
            '<div class="field"><label for="f-date">Date</label><input id="f-date" data-k="date" value="' + esc(c.date) + '" placeholder="e.g. 5 September 2025"></div>' +
          '</div>' +
          '<div class="field"><label for="f-story">A few lines about them</label><textarea id="f-story" data-k="story">' + esc(c.story) + '</textarea></div>' +
          '<div class="field"><label>Show this couple on</label><div class="checks">' +
            [['stories', 'Stories page'], ['prewedding', 'Pre-Wedding page'], ['home', 'Home page']].map(([k, l]) =>
              '<label><input type="checkbox" data-show="' + k + '"' + (c.show[k] ? ' checked' : '') + '> ' + l + '</label>').join('') +
          '</div></div>' +
        '</div></section>' +
      '<section class="panel"><div class="panel__title"><h2 class="h">Photographs <span style="color:var(--muted);font-size:16px">(' + c.photos.length + ')</span></h2></div>' +
        '<label class="drop" id="drop"><input type="file" id="upload" accept="image/*" multiple hidden>' +
          '<b>Drop photos here, or click to upload</b><span>They are resized for the web automatically.</span></label>' +
        '<p class="hint" style="margin:0 0 12px">Drag photos into any order. &#9733; picks the cover on the thumbnail. &times; removes a photo.</p>' +
        '<div class="photos" id="plist">' + c.photos.map((p, i) =>
          '<div class="ph' + (p.isNew ? ' is-new' : '') + '" data-id="' + p.id + '"><img src="' + p.thumb + '" alt="" loading="lazy">' +
            '<span class="ph__n">' + (i + 1) + '</span>' +
            '<button class="ph__btn ph__star' + (p.id === c.cover ? ' is-on' : '') + '" type="button" data-cover="' + p.id + '" aria-label="Use as cover">&#9733;</button>' +
            '<button class="ph__btn ph__del" type="button" data-del="' + p.id + '" aria-label="Remove photo">&times;</button>' +
          '</div>').join('') + '</div>' +
      '</section>' +
      '<button class="btn btn--ghost btn--sm" type="button" id="delete-couple" style="color:#8A2C25;border-color:rgba(138,44,37,.35)">Delete this couple</button>';
    sortable($('#plist'), c.photos, { filter: '.ph__btn', preventOnFilter: false });

    const drop = $('#drop');
    const add = (files) => {
      Array.from(files).filter((f) => f.type.startsWith('image/')).forEach((f) => {
        const url = URL.createObjectURL(f);
        c.photos.push({ id: 'p' + (uid++), thumb: url, big: url, isNew: true });
      });
      if (!c.cover && c.photos[0]) c.cover = c.photos[0].id;
      render();
      toast(files.length + ' photo' + (files.length === 1 ? '' : 's') + ' added', 'They appear at the end — drag them wherever you like.');
    };
    $('#upload').addEventListener('change', (e) => add(e.target.files));
    ['dragover', 'dragenter'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add('is-over'); }));
    ['dragleave', 'drop'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('is-over')));
    drop.addEventListener('drop', (e) => { e.preventDefault(); add(e.dataTransfer.files); });
  };

  const renderHome = () => {
    const H = state.home;
    main.innerHTML =
      '<div class="view__head"><div><p class="eyebrow">Home page</p><h1 class="h">Layout &amp; hero</h1>' +
        '<p class="hint">Drag sections to move them up or down the page. Switch one off to hide it.</p></div></div>' +
      '<section class="panel"><div class="panel__title"><h2 class="h">Headline</h2></div><div class="row">' +
        '<div class="field"><label for="h-title">Headline</label><input id="h-title" data-h="title" value="' + esc(H.title) + '"></div>' +
        '<div class="field"><label for="h-lede">Introduction</label><textarea id="h-lede" data-h="lede" style="min-height:90px">' + esc(H.lede) + '</textarea></div>' +
      '</div></section>' +
      '<section class="panel"><div class="panel__title"><h2 class="h">Hero photographs</h2></div>' +
        '<p class="hint" style="margin:-6px 0 12px">Drag to reorder. Change swaps in any photo from the albums.</p>' +
        '<div class="slides" id="slist">' + H.slides.map((s, i) =>
          '<div class="slide" data-id="' + s.id + '"><img src="' + s.thumb + '" alt="">' +
            '<button class="btn btn--sm" type="button" data-swap="' + i + '" style="background:rgba(251,249,245,.92);color:var(--ink);border-color:transparent">Change</button></div>').join('') +
        '</div></section>' +
      '<section class="panel"><div class="panel__title"><h2 class="h">Sections, top to bottom</h2></div>' +
        '<div class="list" id="seclist">' + H.sections.map((s) =>
          '<div class="sec' + (s.on ? '' : ' is-hidden') + '" data-id="' + s.id + '">' +
            '<button class="drag" type="button" aria-label="Drag to reorder">' + GRIP + '</button>' +
            '<div class="sec__name">' + esc(s.name) + '<small>' + esc(s.note) + '</small></div>' +
            '<button class="toggle" type="button" data-sec="' + s.id + '" aria-pressed="' + s.on + '" aria-label="Show this section"></button>' +
          '</div>').join('') + '</div></section>';
    sortable($('#slist'), H.slides, { filter: 'button', preventOnFilter: false });
    sortable($('#seclist'), H.sections, { handle: '.drag' });
  };

  const renderDetails = () => {
    const D = state.details;
    const f = (k, label) => '<div class="field"><label for="d-' + k + '">' + label + '</label><input id="d-' + k + '" data-d="' + k + '" value="' + esc(D[k]) + '"></div>';
    main.innerHTML =
      '<div class="view__head"><div><p class="eyebrow">Every page</p><h1 class="h">Studio details</h1>' +
        '<p class="hint">Change them once here and every page, the footer and the enquiry form follow.</p></div></div>' +
      '<section class="panel"><div class="row">' +
        '<div class="row row--2">' + f('phone', 'Phone') + f('phone2', 'Second phone') + '</div>' +
        '<div class="row row--2">' + f('whatsapp', 'WhatsApp') + f('instagram', 'Instagram') + '</div>' +
        f('address', 'Studio address') + f('hours', 'Opening hours') +
      '</div></section>';
  };

  /* ---------- the live preview ---------- */
  const nav = '<div class="sc__nav"><img src="assets/brand/logo-row.svg" alt=""><i>Home · Stories · Pre-Wedding · About</i></div>';
  const renderPreview = () => {
    screen.classList.toggle('is-phone', device === 'phone');
    if (view === 'couples' && editing) {
      const c = state.couples.find((x) => x.id === editing);
      const first = c.photos.slice(0, 8);
      screen.innerHTML = nav + '<div class="sc__body"><div class="sc__intro">' +
        '<p class="eyebrow">' + esc([c.place, c.kind, c.date].filter(Boolean).join(' · ')) + '</p>' +
        '<h3>' + esc(c.name || 'New couple') + '</h3><p>' + esc(c.story) + '</p></div>' +
        '<div class="sc__reel">' + (first.length ? first.map((p) => '<img src="' + p.big + '" alt="" loading="lazy">').join('')
          : '<div class="sc__block" style="width:100%">Photos will appear here</div>') + '</div>' +
        (c.photos.length > 8 ? '<p class="sc__more">+ ' + (c.photos.length - 8) + ' more photographs, one after the other</p>' : '') +
        '</div>';
      return;
    }
    if (view === 'couples') {
      const shown = state.couples.filter((c) => c.visible && c.show.stories);
      screen.innerHTML = nav + '<div class="sc__body"><p class="sc__title">Stories</p><div class="sc__thumbs">' +
        shown.map((c) => {
          const cov = coverOf(c);
          return '<div class="sc__thumb"><span>' + (cov ? '<img src="' + cov.thumb + '" alt="">' : '') + '</span><p>' + esc(c.name) + '</p></div>';
        }).join('') + '</div></div>';
      return;
    }
    if (view === 'home') {
      const H = state.home;
      screen.innerHTML = nav + '<div class="sc__body">' + H.sections.filter((s) => s.on).map((s) => s.name === 'Hero'
        ? '<div class="sc__hero"><div><h3>' + esc(H.title) + '</h3><p>' + esc(H.lede.slice(0, 120)) + '…</p></div>' +
            '<img src="' + (H.slides[0] && H.slides[0].big) + '" alt=""></div>'
        : '<div class="sc__block">' + esc(s.name) + '</div>').join('') + '</div>';
      return;
    }
    const D = state.details;
    screen.innerHTML = nav + '<div class="sc__body"><div class="sc__block">Page content</div></div>' +
      '<div class="sc__foot"><img src="assets/brand/logo-light.svg" alt=""><br>' +
      '<b>Call</b> ' + esc(D.phone) + ' · ' + esc(D.phone2) + '<br><b>WhatsApp</b> ' + esc(D.whatsapp) + '<br>' +
      '<b>Studio</b> ' + esc(D.address) + '<br><b>Hours</b> ' + esc(D.hours) + '<br><b>Instagram</b> ' + esc(D.instagram) + '</div>';
  };

  const render = () => {
    sortables.splice(0).forEach((s) => s.destroy());
    const keep = main.scrollTop;
    ({ couples: renderCouples, home: renderHome, details: renderDetails })[view]();
    main.scrollTop = keep;
    renderPreview();
  };

  /* ---------- wiring ---------- */
  $('#login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    $('#login').hidden = true;
    $('#app').hidden = false;
    render();
    toast('Welcome back, Anil', 'This is a demo — nothing here changes the live website.');
  });

  $('.side').addEventListener('click', (e) => {
    const b = e.target.closest('[data-view]');
    if (!b) return;
    view = b.dataset.view;
    editing = null;
    $$('.side button').forEach((x) => x.setAttribute('aria-current', String(x === b)));
    main.scrollTop = 0;
    render();
  });

  main.addEventListener('click', (e) => {
    const t = e.target;
    const c = editing && state.couples.find((x) => x.id === editing);
    if (t.closest('[data-edit]')) { editing = t.closest('[data-edit]').dataset.edit; main.scrollTop = 0; render(); return; }
    if (t.closest('#back') || t.closest('#done')) {
      if (t.closest('#done')) toast('Saved', 'Press “Publish changes” when you are ready to put it live.');
      editing = null; render(); return;
    }
    if (t.closest('[data-vis]')) {
      const x = state.couples.find((q) => q.id === t.closest('[data-vis]').dataset.vis);
      x.visible = !x.visible; render(); return;
    }
    if (t.closest('#add-couple')) {
      const n = { id: 'new-' + (uid++), name: '', kind: 'Wedding', place: 'Bangalore', date: '', story: '',
        show: { stories: true, prewedding: false, home: true }, visible: true, photos: [], cover: null };
      state.couples.unshift(n); editing = n.id; render(); $('#f-name').focus(); return;
    }
    if (t.closest('#delete-couple') && c) {
      if (!confirm('Delete ' + (c.name || 'this couple') + ' and all their photos?')) return;
      state.couples.splice(state.couples.indexOf(c), 1); editing = null; render(); toast('Couple deleted'); return;
    }
    if (t.closest('[data-cover]') && c) { c.cover = t.closest('[data-cover]').dataset.cover; render(); toast('Cover photo changed'); return; }
    if (t.closest('[data-del]') && c) {
      const id = t.closest('[data-del]').dataset.del;
      c.photos = c.photos.filter((p) => p.id !== id);
      if (c.cover === id) c.cover = c.photos[0] ? c.photos[0].id : null;
      render(); return;
    }
    if (t.closest('[data-sec]')) {
      const s = state.home.sections.find((q) => q.id === t.closest('[data-sec]').dataset.sec);
      s.on = !s.on; render(); return;
    }
    if (t.closest('[data-swap]')) pick(+t.closest('[data-swap]').dataset.swap);
  });

  /* typing updates the preview as you go, without redrawing the form */
  main.addEventListener('input', (e) => {
    const t = e.target;
    const c = editing && state.couples.find((x) => x.id === editing);
    if (t.dataset.k && c) c[t.dataset.k] = t.value;
    if (t.dataset.show && c) c.show[t.dataset.show] = t.checked;
    if (t.dataset.h) state.home[t.dataset.h] = t.value;
    if (t.dataset.d) state.details[t.dataset.d] = t.value;
    renderPreview();
  });

  /* choose any album photo for a hero slide */
  const pick = (slot) => {
    const box = document.createElement('div');
    box.className = 'picker';
    box.innerHTML = '<div class="picker__card"><div class="panel__title"><h2 class="h">Choose a photograph</h2>' +
      '<button class="btn btn--ghost btn--sm" type="button" data-x>Cancel</button></div><div class="photos">' +
      allPhotos().map((p) => '<div class="ph" data-pick="' + p.id + '"><img src="' + p.thumb + '" alt="" loading="lazy"></div>').join('') +
      '</div></div>';
    document.body.appendChild(box);
    box.addEventListener('click', (e) => {
      const hit = e.target.closest('[data-pick]');
      if (hit) {
        const p = allPhotos().find((q) => q.id === hit.dataset.pick);
        state.home.slides[slot] = { id: 'p' + (uid++), thumb: p.thumb, big: p.big };
        render();
        toast('Hero photo changed');
      }
      if (hit || e.target === box || e.target.closest('[data-x]')) box.remove();
    });
  };

  $$('.seg button').forEach((b) => b.addEventListener('click', () => {
    device = b.dataset.dev;
    $$('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    renderPreview();
  }));
  $('#open-preview').addEventListener('click', () => $('#preview').classList.add('is-open'));
  $('#close-preview').addEventListener('click', () => $('#preview').classList.remove('is-open'));
  $('#publish').addEventListener('click', () =>
    toast('Published — the website updates in about a minute', 'Demo mode: the live website was not changed.'));
})();
</script>
</body>
</html>
